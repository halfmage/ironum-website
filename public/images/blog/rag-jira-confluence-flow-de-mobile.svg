<svg xmlns="http://www.w3.org/2000/svg" width="360" height="738" viewBox="0 0 360 738" role="img" aria-label="Wie RAG über Jira und Confluence funktioniert, in zwei Abläufen. Indexieren: Ein Synchronisationsdienst liest Inhalte und Zugriffsregeln aus Jira und Confluence, jeweils im eigenen Takt (Schritte 1 und 6), und speichert Abschnitte und Vektoren mit ihren Zugriffsregeln in einem Index (Schritte 2 und 3). Antworten: Eine Person stellt eine Frage; der Berechtigungsfilter durchsucht den Index und behält nur Abschnitte, die diese Person öffnen darf (Schritt 4); das Sprachmodell antwortet nur aus diesen Abschnitten (Schritt 5); die Antwort verlinkt jeden genutzten Vorgang und jede Seite. Alles außer der Person läuft auf einer Infrastruktur Ihrer Wahl in der EU.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
