<svg xmlns="http://www.w3.org/2000/svg" width="360" height="714" viewBox="0 0 360 714" role="img" aria-label="How RAG over Jira and Confluence works, in two flows. Indexing: a sync service reads content and access rules from Jira and Confluence, each on its own schedule (steps 1 and 6), and stores passages and vectors with their access rules in an index (steps 2 and 3). Answering: a person asks a question; the permission filter searches the index and keeps only passages this person may open (step 4); the language model answers from those passages only (step 5); the answer links to every issue and page used. Everything except the person runs on infrastructure you choose in the EU.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
