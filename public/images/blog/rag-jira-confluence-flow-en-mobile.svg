<text x="16" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" fill="#000000" font-weight="600">Two flows, one permission check</text>
<text x="16" y="54" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280">The numbers match the steps in the text</text>
